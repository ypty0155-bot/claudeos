<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôtel Aurelle</title>
<meta name="description" content="一段用 Three.js 实时渲染的超豪华酒店入住影片：从夜色中的前庭进入大堂，环绕一周，乘电梯到三十八层，刷卡进入套房，熄灯入睡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@300;500&display=swap">
<style>
  /* Single cinematic look by design: a night film, dark in every theme. */
  :root{
    color-scheme: dark;
    --ink:#06070a;
    --ink-2:#0e1016;
    --ivory:#f2ece0;
    --ivory-dim:rgba(242,236,224,.64);
    --ivory-faint:rgba(242,236,224,.2);
    --gold:#c9a86a;
    --gold-hi:#ecd6a2;
    --line:rgba(242,236,224,.16);
    --lb:0px;
    --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
    --cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --ui:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  }
  html,body{height:100%}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;background:var(--ink)}

  .lb{position:fixed;left:0;right:0;height:var(--lb);background:#000;z-index:2;pointer-events:none;transition:height 1.6s cubic-bezier(.6,0,.2,1)}
  .lb.top{top:0}
  .lb.bot{bottom:0}

  #hud{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,3vw) 0;pointer-events:none;
    font:500 11px/1 var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--ivory-dim);opacity:0;transition:opacity 1.2s}
  body.started #hud{opacity:1}
  #hud .brand{font:400 15px/1 var(--display);letter-spacing:.42em;color:var(--gold-hi)}
  #hud .meta{display:flex;gap:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #hud .meta span{font-family:var(--cn),var(--ui);letter-spacing:.18em}
  #hud #clk{font-family:var(--ui);letter-spacing:.14em;color:var(--gold-hi)}

  #cap{position:fixed;z-index:3;left:max(16px,4vw);bottom:calc(var(--lb) + 84px);max-width:min(560px,calc(100vw - 32px));
    pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity 1.3s ease,transform 1.3s ease;text-shadow:0 1px 18px rgba(0,0,0,.55)}
  #cap.on{opacity:1;transform:none}
  #cap .idx{display:flex;align-items:center;gap:12px;font:500 11px/1 var(--ui);letter-spacing:.34em;color:var(--gold);font-variant-numeric:tabular-nums}
  #cap .idx::after{content:"";width:52px;height:1px;background:var(--gold);opacity:.7}
  #cap .zh{font:500 clamp(28px,4.4vw,48px)/1.15 var(--cn);letter-spacing:.14em;margin:12px 0 6px;text-wrap:balance}
  #cap .en{font:italic 400 clamp(16px,1.9vw,22px)/1.2 var(--display);color:var(--gold-hi);letter-spacing:.03em}
  #cap .desc{font:300 14px/1.8 var(--cn);color:var(--ivory-dim);margin-top:10px;letter-spacing:.06em;max-width:30em}

  #ctl{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
    padding:22px max(16px,3vw) calc(env(safe-area-inset-bottom,0px) + 16px);
    background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));opacity:0;pointer-events:none;transition:opacity .5s}
  body.started.show-ctl #ctl, body.started.paused #ctl{opacity:1;pointer-events:auto}
  .btn{appearance:none;border:1px solid var(--line);background:rgba(12,13,17,.45);color:var(--ivory);height:36px;min-width:36px;padding:0 12px;border-radius:18px;
    display:inline-grid;place-items:center;cursor:pointer;font:500 11px/1 var(--ui);letter-spacing:.18em;transition:border-color .2s,background .2s}
  .btn:hover{border-color:var(--gold);background:rgba(201,168,106,.12)}
  .btn:focus-visible,#scrub:focus-visible,#go:focus-visible,#again:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
  .btn svg{width:14px;height:14px;display:block}
  .btn.round{padding:0;width:36px}
  #time{font:400 12px/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--ivory-dim);white-space:nowrap}
  #scrub{position:relative;flex:1;min-width:80px;height:30px;cursor:pointer;touch-action:none;outline:none}
  #chap{position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);display:flex;gap:3px}
  #chap span{position:relative;height:100%;background:var(--ivory-faint);overflow:hidden}
  #chap span i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold)}
  #knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:var(--gold-hi);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(201,168,106,.2);pointer-events:none}
  #tip{position:absolute;bottom:30px;left:0;transform:translateX(-50%);font:400 12px/1 var(--cn);letter-spacing:.08em;white-space:nowrap;background:rgba(8,9,12,.88);border:1px solid var(--line);padding:7px 10px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none}
  #scrub:hover #tip{opacity:1}
  @media (max-width:560px){ #time{display:none} #btn-q{display:none} #hud .meta #loc{display:none} #cap{bottom:calc(var(--lb) + 76px)} }

  .ov{position:fixed;inset:0;z-index:5;display:flex;overflow-y:auto;text-align:center;padding-inline:16px}
  .ov>div{margin:auto;padding-block:28px}
  @media (max-height:560px){
    .mono{width:50px;height:50px;margin-bottom:12px}
    #intro .sub{margin-top:12px}
    #intro .lede{margin-top:12px;font-size:13px;line-height:1.7}
    #go,#again{margin-top:16px}
    #intro .hint{margin-top:10px}
  }
  #intro{background:radial-gradient(ellipse 70% 60% at 50% 52%,rgba(6,7,10,.05),rgba(6,7,10,.78) 72%,rgba(6,7,10,.94));transition:opacity 1.8s ease}
  #intro.gone{opacity:0;pointer-events:none}
  .mono{width:78px;height:78px;margin:0 auto 22px;color:var(--gold);display:block}
  #intro h1{font:400 clamp(42px,9vw,96px)/1 var(--display);letter-spacing:.32em;margin:0 0 0 .32em;text-transform:uppercase;color:var(--ivory);text-wrap:balance}
  #intro .sub{font:300 clamp(15px,2vw,19px)/1.4 var(--cn);letter-spacing:.5em;margin:20px 0 0 .5em;color:var(--gold-hi)}
  #intro .lede{font:300 14px/1.95 var(--cn);color:var(--ivory-dim);max-width:32em;margin:26px auto 0;letter-spacing:.05em}
  #go,#again{appearance:none;margin-top:34px;height:48px;padding:0 30px;border-radius:24px;border:1px solid var(--gold);background:rgba(201,168,106,.12);color:var(--gold-hi);
    font:500 14px/1 var(--cn);letter-spacing:.3em;cursor:pointer;transition:background .25s,color .25s,opacity .3s;font-variant-numeric:tabular-nums}
  #go:hover:not(:disabled),#again:hover{background:var(--gold);color:var(--ink)}
  #go:disabled{cursor:progress;opacity:.75;border-color:var(--line);color:var(--ivory-dim)}
  #intro .hint{margin-top:18px;font:400 11px/1.8 var(--ui);letter-spacing:.2em;color:rgba(242,236,224,.42)}
  #intro .hint b{font-weight:400;font-family:var(--cn)}
  #err{margin-top:18px;font:400 13px/1.8 var(--cn);color:#e9a58e;max-width:30em}

  #outro{opacity:0;pointer-events:none;transition:opacity 2.2s ease}
  #outro.on{opacity:1;pointer-events:auto}
  #outro .gn{font:300 clamp(46px,9vw,92px)/1 var(--cn);letter-spacing:.42em;margin:0 0 0 .42em;color:var(--ivory)}
  #outro .en{font:italic 400 clamp(17px,2vw,22px)/1.4 var(--display);color:var(--gold-hi);margin:22px 0 0;letter-spacing:.04em}
  #outro .room{font:500 11px/1 var(--ui);letter-spacing:.34em;color:rgba(242,236,224,.45);margin-top:14px;text-transform:uppercase}

  @media (prefers-reduced-motion: reduce){
    #cap,#intro,#outro,.lb{transition-duration:.01s}
  }
</style>

<canvas id="gl" tabindex="-1" aria-label="超豪华酒店入住全程的实时三维影片"></canvas>
<div class="lb top"></div><div class="lb bot"></div>

<div id="hud" aria-hidden="true">
  <div class="brand">Aurelle</div>
  <div class="meta"><span id="loc">前庭</span><span id="clk">22:41</span></div>
</div>

<div id="cap" aria-live="polite">
  <div class="idx"><span id="cap-i">01 / 06</span></div>
  <div class="zh" id="cap-zh">抵达</div>
  <div class="en" id="cap-en">Arrival</div>
  <div class="desc" id="cap-d"></div>
</div>

<div id="ctl">
  <button class="btn round" id="btn-play" aria-label="暂停">
    <svg id="ic-pause" viewBox="0 0 14 14" fill="currentColor"><rect x="2.5" y="2" width="3" height="10" rx=".6"/><rect x="8.5" y="2" width="3" height="10" rx=".6"/></svg>
    <svg id="ic-play" viewBox="0 0 14 14" fill="currentColor" hidden><path d="M3.5 2.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L4.4 1.7a.6.6 0 0 0-.9.5z"/></svg>
  </button>
  <div id="time"><span id="t-cur">00:00</span> / <span id="t-dur">02:36</span></div>
  <div id="scrub" role="slider" tabindex="0" aria-label="时间轴" aria-valuemin="0" aria-valuemax="156" aria-valuenow="0">
    <div id="chap"></div>
    <div id="knob"></div>
    <div id="tip">抵达</div>
  </div>
  <button class="btn round" id="btn-snd" aria-label="静音">
    <svg id="ic-snd" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 5.2h2.2L7.4 2.6v8.8L4.2 8.8H2z" fill="currentColor" stroke="none"/><path d="M9.3 4.8a3 3 0 0 1 0 4.4M10.9 3.2a5.2 5.2 0 0 1 0 7.6"/></svg>
    <svg id="ic-mute" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" hidden><path d="M2 5.2h2.2L7.4 2.6v8.8L4.2 8.8H2z" fill="currentColor" stroke="none"/><path d="M9.4 5.2l3.4 3.6M12.8 5.2l-3.4 3.6"/></svg>
  </button>
  <button class="btn" id="btn-q" aria-label="切换画质">高画质</button>
  <button class="btn round" id="btn-fs" aria-label="全屏">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2V9"/></svg>
  </button>
</div>

<section class="ov" id="intro">
  <div>
    <svg class="mono" viewBox="0 0 80 80" aria-hidden="true">
      <circle cx="40" cy="40" r="37" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="40" cy="40" r="32.5" fill="none" stroke="currentColor" stroke-width=".6"/>
      <text x="40" y="53" text-anchor="middle" font-family="Bodoni Moda, Didot, Georgia, serif" font-size="38" fill="currentColor">A</text>
    </svg>
    <h1>Aurelle</h1>
    <p class="sub">澜悦酒店 · 一夜入住</p>
    <p class="lede">从夜色中的前庭出发，穿过十二米挑高的大堂并环顾一周，乘电梯直上三十八层，刷卡走进 3808 套房，然后熄灯入睡。全程实时渲染，约两分半钟。</p>
    <button id="go" disabled>正在搭建场景 0%</button>
    <p class="hint">建议打开声音 · 空格 暂停 · ← → 快退 / 快进 · F 全屏</p>
    <p id="err" hidden></p>
  </div>
</section>

<section class="ov" id="outro" aria-hidden="true">
  <div>
    <p class="gn">晚安</p>
    <p class="en">Good night from Hôtel Aurelle</p>
    <p class="room">Suite 3808 · Floor 38</p>
    <button id="again">重新入住</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Reflector.js"></script>
<script>
'use strict';
(async function main(){
/* =====================================================================
   HÔTEL AURELLE — a real-time, fully procedural check-in film.
   Everything (architecture, marble, crystal, city, sound) is generated
   in code. The film is a pure function of the timeline t, so it can be
   paused and scrubbed like a video.
   ===================================================================== */
const $ = s => document.querySelector(s);
const goBtn = $('#go');
function fail(msg){ const e=$('#err'); e.hidden=false; e.textContent=msg; goBtn.textContent='无法播放'; }
if (typeof THREE === 'undefined' || !THREE.EffectComposer || !THREE.Reflector) { fail('三维引擎没有加载成功，请检查网络后刷新页面。'); return; }

THREE.ColorManagement.legacyMode = false;
const TAU = Math.PI*2, H = 37*4.2;              // floor 38 sits 155.4 m above the lobby
const DUR = 156;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), ease=x=>x*x*(3-2*x), ease5=x=>x*x*x*(x*(x*6-15)+10);
const lin=(r,g,b)=>new THREE.Color().setRGB(r,g,b);
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));

/* ---------------- renderer & post ---------------- */
const canvasEl = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias:false, powerPreference:'high-performance', stencil:false });
} catch(e) { fail('当前浏览器无法创建 WebGL 画布，请换用最新版 Chrome、Edge 或 Safari。'); return; }
if (!renderer.capabilities.isWebGL2) { fail('需要支持 WebGL 2 的浏览器才能播放这段影片。'); return; }
renderer.physicallyCorrectLights = true;
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 1);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(lin(0.03,0.03,0.05), 0.00052);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 7000);
camera.rotation.order = 'YXZ';
scene.add(camera);

const Q = { hi:true, scale:(devicePixelRatio||1)>=2?0.72:1, dpr:Math.min(devicePixelRatio||1, 2) };
const rt0 = new THREE.WebGLRenderTarget(4, 4, { type:THREE.HalfFloatType, samples:4 });
const composer = new THREE.EffectComposer(renderer, rt0);
const renderPass = new THREE.RenderPass(scene, camera);
composer.addPass(renderPass);
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256,256), 0.42, 0.32, 1.3);
bloom.renderTargetBright.texture.type = THREE.HalfFloatType;
bloom.renderTargetsHorizontal.forEach(r=>r.texture.type=THREE.HalfFloatType);
bloom.renderTargetsVertical.forEach(r=>r.texture.type=THREE.HalfFloatType);
composer.addPass(bloom);
const FinalShader = {
  uniforms:{ tDiffuse:{value:null}, exposure:{value:1.0}, fade:{value:0}, lid:{value:0}, time:{value:0}, res:{value:new THREE.Vector2(1,1)}, grain:{value:0.035}, vig:{value:0.55} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float exposure, fade, lid, time, grain, vig; uniform vec2 res; varying vec2 vUv;
    vec3 RRTAndODTFit(vec3 v){ vec3 a=v*(v+0.0245786)-0.000090537; vec3 b=v*(0.983729*v+0.4329510)+0.238081; return a/b; }
    vec3 aces(vec3 c){
      const mat3 I=mat3(vec3(0.59719,0.07600,0.02840),vec3(0.35458,0.90834,0.13383),vec3(0.04823,0.01566,0.83777));
      const mat3 O=mat3(vec3(1.60475,-0.10208,-0.00327),vec3(-0.53108,1.10813,-0.07276),vec3(-0.07367,-0.00605,1.07602));
      c = I*(c/0.6); c = RRTAndODTFit(c); return clamp(O*c,0.0,1.0); }
    vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1.0/2.4))-0.055, step(0.0031308,c)); }
    float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * exposure;
      c = aces(c);
      float l = dot(c, vec3(0.2126,0.7152,0.0722));
      c *= mix(vec3(0.93,0.97,1.06), vec3(1.04,1.0,0.94), smoothstep(0.05,0.7,l));   // cool shadows, warm highlights
      c = mix(vec3(l), c, 1.06);
      vec2 p = vUv-0.5; p.x *= res.x/res.y;
      c *= 1.0 - vig*smoothstep(0.35, 1.15, length(p));
      c = toSRGB(max(c,0.0));
      c += (hash(vUv*res + fract(time)*917.0)-0.5)*grain;
      // eyelids closing: curved lids from top and bottom
      float open = 1.0 - lid;
      float edge = open * (1.0 - 0.22*pow(abs(vUv.x-0.5)*2.0, 2.0));
      float y = abs(vUv.y-0.5)*2.0;
      c *= 1.0 - smoothstep(edge-0.06, edge+0.015, y) * step(0.001, lid);
      c *= 1.0 - fade;
      gl_FragColor = vec4(c, 1.0);
    }`
};
const finalPass = new THREE.ShaderPass(FinalShader);
composer.addPass(finalPass);

/* ---------------- geometry helpers ---------------- */
function add(parent, geo, mat, x=0,y=0,z=0, rx=0,ry=0,rz=0){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); parent.add(m); return m; }
function boxMM(parent, x0,y0,z0, x1,y1,z1, mat){ return add(parent, new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)), mat, (x0+x1)/2,(y0+y1)/2,(z0+z1)/2); }
function box(parent, w,h,d, mat, x,y,z, ry=0){ return add(parent, new THREE.BoxGeometry(w,h,d), mat, x,y,z, 0,ry,0); }
function cylY(parent, rt, rb, h, mat, x,y,z, seg=24, open=false){ return add(parent, new THREE.CylinderGeometry(rt,rb,h,seg,1,open), mat, x, y+h/2, z); }
function lathe(parent, pts, mat, x,y,z, seg=32){ return add(parent, new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])), seg), mat, x,y,z); }
function planeXZ(parent, w,d, mat, x,y,z){ return add(parent, new THREE.PlaneGeometry(w,d), mat, x,y,z, -Math.PI/2,0,0); }
function tube(parent, pts, r, mat, seg=64, rseg=8, closed=false){ const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)), closed); return add(parent, new THREE.TubeGeometry(c, seg, r, rseg, closed), mat); }
function group(parent, x=0,y=0,z=0, ry=0){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; parent.add(g); return g; }
function rbox(w,h,d,r,s=2){
  const sg=s*2+1; r=Math.min(r,w/2,h/2,d/2);
  const g=new THREE.BoxGeometry(1,1,1,sg,sg,sg).toNonIndexed();
  const pos=g.attributes.position, nor=g.attributes.normal, half=0.5/sg, bx=w/2-r, by=h/2-r, bz=d/2-r;
  const p=new THREE.Vector3(), n=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    p.fromBufferAttribute(pos,i);
    n.set(p.x-Math.sign(p.x)*half, p.y-Math.sign(p.y)*half, p.z-Math.sign(p.z)*half).normalize();
    pos.setXYZ(i, bx*Math.sign(p.x)+n.x*r, by*Math.sign(p.y)+n.y*r, bz*Math.sign(p.z)+n.z*r);

function bake(root){

  (function walk(o){ for(const c of o.children){ if(c.userData.dyn) continue; if(c.isMesh && !c.isInstancedMesh && !c.userData.keep) victims.push(c); walk(c); } })(root);

  const m4=new THREE.Matrix4(), nm=new THREE.Matrix3(), v=new THREE.Vector3(), nv=new THREE.Vector3();
  for(const [mat,list] of buckets){
    let total=0; const gs=[];
    for(const m of list){ const g=m.geometry.index? m.geometry.toNonIndexed() : m.geometry; gs.push([g,m]); total+=g.attributes.position.count; }

      for(let i=0;i<pa.count;i++){

        const j=(o+i)*2;
        if(us){ const ax=Math.abs(nv.x), ay=Math.abs(nv.y), az=Math.abs(nv.z); let u,w;
          if(ay>=ax && ay>=az){u=v.x; w=-v.z;} else if(ax>=az){u=v.z*(nv.x>0?-1:1); w=v.y;} else {u=v.x*(nv.z>0?1:-1); w=v.y;}

    float h13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
    float h12(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
    float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h12(i),h12(i+vec2(1,0)),f.x), mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }

      vec3 zen=vec3(0.0022,0.0042,0.015), mid=vec3(0.007,0.013,0.04), hor=vec3(0.06,0.045,0.05);
      vec3 col=mix(hor,mid,smoothstep(0.0,0.22,hh)); col=mix(col,zen,smoothstep(0.2,0.9,hh));
      col+=vec3(0.19,0.085,0.035)*exp(-hh*13.0)*0.55;
      float md=dot(d,moonDir);
      if(h>0.0){
        vec2 cp=d.xz/(h+0.12)*1.5+vec2(uTime*0.004,uTime*0.0018);
        float c=smoothstep(0.55,0.86,fbm(cp))*smoothstep(0.0,0.22,h);
        vec3 cc=mix(vec3(0.085,0.055,0.045),vec3(0.035,0.042,0.065),smoothstep(0.0,0.45,h))+vec3(0.1,0.11,0.14)*pow(max(md,0.0),10.0);

  else { applyRig(RIG_UPPER,H,[1,1,1,on*ceil,on*lLamp,on*rLamp,on*fLamp,t<95?1:0]); PL[7].position.y=2.45+y; }
  hemi.intensity=t<27?0.35:(t>72.8?0.12:0.2);
  // clock
  const ck=clockAt(t); if(ck!==D.clock.last){ D.clock.last=ck; const x=D.clock.x; x.fillStyle='#050404'; x.fillRect(0,0,256,96); x.fillStyle='#f3c98a'; x.font=`400 64px ${UIF}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ck,128,52); D.clock.tex.needsUpdate=true; }
  // grade
  let lid=0; lid=Math.max(lid,Math.sin(Math.PI*seg(t,147,147.7))*(t<147.7?1:0), Math.sin(Math.PI*seg(t,148.3,149.2))*0.95*(t<149.2?1:0), ease(seg(t,149.8,151.2)));
  finalPass.uniforms.lid.value=lid;
  finalPass.uniforms.fade.value=ease(seg(t,151.2,152.6));
  finalPass.uniforms.exposure.value=pw(t,EXPO);
  const ek=pw(t,ENVK); for(const m of ENV_MATS) m.envMapIntensity=m.userData.envBase*ek;
  finalPass.uniforms.time.value=rt;
  return walk;
}

/* =====================================================================
   SOUND — synthesized with Web Audio, starts on the first click
   ===================================================================== */
const AU={ctx:null,on:true,next:0,step:0};
function audioInit(){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC||AU.ctx) return;
  const ctx=new AC(); AU.ctx=ctx;
  AU.master=ctx.createGain(); AU.master.gain.value=AU.on?0.85:0;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3;
  AU.master.connect(comp); comp.connect(ctx.destination);
  const len=ctx.sampleRate*3.4|0, ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4); }
  AU.verb=ctx.createConvolver(); AU.verb.buffer=ir; const vg=ctx.createGain(); vg.gain.value=0.32; AU.verb.connect(vg); vg.connect(AU.master);
  AU.noise=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); { const d=AU.noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  AU.music=ctx.createGain(); AU.music.gain.value=0; AU.music.connect(AU.master); const ms=ctx.createGain(); ms.gain.value=0.9; AU.music.connect(ms); ms.connect(AU.verb);
  const bed=(type,f,q)=>{ const s=ctx.createBufferSource(); s.buffer=AU.noise; s.loop=true; const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const g=ctx.createGain(); g.gain.value=0; s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(); return g; };
  AU.fount=bed('bandpass',1300,0.5); AU.city=bed('lowpass',320,0.7); AU.room=bed('lowpass',180,0.5);
  const hum=ctx.createGain(); hum.gain.value=0; const hl=ctx.createBiquadFilter(); hl.type='lowpass'; hl.frequency.value=260; hl.connect(hum); hum.connect(AU.master);
  for(const f of [56,112,168]){ const o=ctx.createOscillator(); o.frequency.value=f; const g=ctx.createGain(); g.gain.value=f===56?0.6:0.2; o.connect(g); g.connect(hl); o.start(); }
  AU.hum=hum; const hn=bed('bandpass',420,0.8); AU.hum2=hn;
  const mot=ctx.createOscillator(); mot.type='sawtooth'; mot.frequency.value=92; const mf=ctx.createBiquadFilter(); mf.type='lowpass'; mf.frequency.value=380; AU.motor=ctx.createGain(); AU.motor.gain.value=0; mot.connect(mf); mf.connect(AU.motor); AU.motor.connect(AU.master); mot.start();
  AU.next=ctx.currentTime+0.2;
}
const midi=n=>440*Math.pow(2,(n-69)/12);
const CHORDS=[[48,55,59,62,64],[45,52,55,59,60],[41,48,52,57,59],[43,50,55,57,62]];
function pad(when,notes,dur){ const c=AU.ctx; for(const n of notes){ for(const det of [-7,7]){ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=midi(n); o.detune.value=det; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=620; f.Q.value=0.5; const g=c.createGain(); g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(0.012,when+2.6); g.gain.setValueAtTime(0.012,when+dur-2.4); g.gain.linearRampToValueAtTime(0,when+dur+0.6); o.connect(f); f.connect(g); g.connect(AU.music); o.start(when); o.stop(when+dur+0.8); } } }
function pluck(when,n,v){ const c=AU.ctx; const o=c.createOscillator(); o.type='triangle'; o.frequency.value=midi(n); const o2=c.createOscillator(); o2.frequency.value=midi(n)*2.0; const g2=c.createGain(); g2.gain.value=0.25;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3200,when); f.frequency.exponentialRampToValueAtTime(700,when+1.6);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(v,when+0.008); g.gain.exponentialRampToValueAtTime(0.0001,when+3.2);
  o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(AU.music); o.start(when); o2.start(when); o.stop(when+3.3); o2.stop(when+3.3); }
const rMus=mulberry32(4242);
function scheduleMusic(){ const c=AU.ctx; while(AU.next<c.currentTime+0.35){ const s=AU.step, ch=CHORDS[Math.floor(s/16)%4];
    if(s%16===0){ pad(AU.next,ch,8.2); pluck(AU.next,ch[0]-12,0.09); }
    const pat=[1,0,0.6,0,0.8,0,0.5,0.3,0.9,0,0.55,0,0.7,0.2,0.45,0][s%16];
    if(rMus()<pat*0.8){ const n=ch[1+((rMus()*4)|0)]+12+(rMus()<0.3?12:0); pluck(AU.next,n,0.035+rMus()*0.04); }
    AU.next+=0.5; AU.step++; } }
function noiseShot(when,dur,type,f0,f1,gain,q=1){ const c=AU.ctx; const s=c.createBufferSource(); s.buffer=AU.noise; const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q; fl.frequency.setValueAtTime(f0,when); fl.frequency.exponentialRampToValueAtTime(f1,when+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(gain,when+Math.min(0.25,dur*0.3)); g.gain.exponentialRampToValueAtTime(0.0001,when+dur); s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(when,Math.random()); s.stop(when+dur+0.05); }
function tone(when,f,dur,gain,type='sine',toVerb=true){ const c=AU.ctx; const o=c.createOscillator(); o.type=type; o.frequency.value=f; const g=c.createGain(); g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(gain,when+0.006); g.gain.exponentialRampToValueAtTime(0.0001,when+dur); o.connect(g); g.connect(AU.master); if(toVerb) g.connect(AU.verb); o.start(when); o.stop(when+dur+0.05); }
function sfx(name){ if(!AU.ctx) return; const w=AU.ctx.currentTime+0.01;
  switch(name){
    case 'slide': noiseShot(w,1.6,'bandpass',500,1400,0.05,0.8); break;
    case 'click': noiseShot(w,0.05,'highpass',3000,5000,0.06); tone(w,2200,0.04,0.02,'square',false); break;
    case 'ding': for(const [m,a] of [[1,0.09],[2.76,0.03],[5.4,0.012]]) tone(w,1318.5*m,2.4/m,a); break;
    case 'elev': noiseShot(w,2.3,'lowpass',240,700,0.06,0.7); break;
    case 'beep': tone(w,1950,0.08,0.05,'square',false); tone(w+0.12,2600,0.1,0.05,'square',false); break;
    case 'lock': noiseShot(w,0.06,'bandpass',1800,1200,0.12,2); tone(w+0.02,140,0.16,0.12,'sine',false); noiseShot(w+0.1,0.05,'highpass',2500,3500,0.05); break;
    case 'swing': noiseShot(w,1.8,'bandpass',260,180,0.035,1.5); break;
    case 'welcome': for(const [i,n] of [72,76,79,84].entries()) tone(w+i*0.16,midi(n),2.2,0.03); break;
    case 'latch': noiseShot(w,0.08,'bandpass',900,600,0.08,2); tone(w,110,0.2,0.08,'sine',false); break;
  } }
function step(surface){ if(!AU.ctx) return; const w=AU.ctx.currentTime+0.005;
  if(surface==='marble'){ noiseShot(w,0.09,'bandpass',2400,1600,0.025,1.4); tone(w,95,0.09,0.03,'sine',false); }
  else if(surface==='stone'){ noiseShot(w,0.12,'bandpass',1200,800,0.02,1); }
  else { noiseShot(w,0.14,'lowpass',400,200,0.03,0.7); } }
function audioFrame(t, playing, walk){
  if(!AU.ctx) return; const c=AU.ctx, now=c.currentTime;
  if(playing) scheduleMusic(); else AU.next=Math.max(AU.next,now+0.2);
  const set=(p,v)=>p.setTargetAtTime(v,now,0.25);
  set(AU.music.gain, playing?0.55*(1-ease(seg(t,145,153))):0);
  const fd=Math.hypot(camera.position.x,camera.position.z-30);
  set(AU.fount.gain, playing&&t<30?0.22*clamp(1-fd/70,0,1)*(t>27.5?0.25:1):0);
  set(AU.city.gain, playing?(t<27?0.05:(t>113&&t<150?0.02*ease(seg(t,113,119)):0)):0);
  set(AU.room.gain, playing?0.03:0);
  const ride=playing&&t>RIDE0-0.3&&t<RIDE1+0.3?1:0; set(AU.hum.gain,0.05*ride); set(AU.hum2.gain,0.012*ride);
  set(AU.motor.gain, playing&&((t>113&&t<119.5)||(t>141&&t<147.5))?0.012:0);
}

/* =====================================================================
   PLAYER
   ===================================================================== */
const body=document.body, capEl=$('#cap');
let tl=0, playing=false, started=false, lastNow=performance.now(), prevT=0, capTimer=0, curCh=-1, lastStep=-1;
const chapWrap=$('#chap');
CH.forEach((c,i)=>{ const s=document.createElement('span'); const end=i<CH.length-1?CH[i+1].t:DUR; s.style.flex=String(end-c.t); s.appendChild(document.createElement('i')); chapWrap.appendChild(s); });
$('#t-dur').textContent=fmt(DUR);
function fmt(s){ s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function showCaption(i){ const c=CH[i]; $('#cap-i').textContent=`${String(i+1).padStart(2,'0')} / ${String(CH.length).padStart(2,'0')}`; $('#cap-zh').textContent=c.zh; $('#cap-en').textContent=c.en; $('#cap-d').textContent=c.d; capEl.classList.add('on'); capTimer=6.5; }
function setPlaying(p){ playing=p; body.classList.toggle('paused',!p); $('#ic-play').hidden=p; $('#ic-pause').hidden=!p; $('#btn-play').setAttribute('aria-label',p?'暂停':'播放'); if(AU.ctx){ if(p) AU.ctx.resume(); } poke(); }
function seek(t){ tl=clamp(t,0,DUR); prevT=tl; lastStep=-1; const i=chapterAt(tl); if(i!==curCh){ curCh=i; showCaption(i); } if(tl<152) $('#outro').classList.remove('on'); }
function updateUI(){
  $('#t-cur').textContent=fmt(tl);
  const kids=chapWrap.children; CH.forEach((c,i)=>{ const end=i<CH.length-1?CH[i+1].t:DUR; kids[i].firstChild.style.width=(clamp((tl-c.t)/(end-c.t),0,1)*100)+'%'; });
  $('#knob').style.left=(tl/DUR*100)+'%'; $('#scrub').setAttribute('aria-valuenow',String(Math.round(tl)));
  const i=chapterAt(tl);
  let loc=['前庭','大堂','电梯厅','38F 走廊','3808 套房','3808 套房'][i];
  if(tl>65.5&&tl<88.4){ const n=1+Math.round(cabY(tl)/4.2); loc='电梯 · '+(n<=1?'L':Math.min(38,n)+'F'); }
  $('#loc').textContent=loc; $('#clk').textContent=clockAt(tl);
}
let ctlTimer=0; function poke(){ body.classList.add('show-ctl'); ctlTimer=2.8; }
addEventListener('pointermove',poke,{passive:true}); addEventListener('pointerdown',poke,{passive:true});
$('#btn-play').onclick=()=>{ if(tl>=DUR-0.01) seek(0); setPlaying(!playing); };
$('#btn-snd').onclick=()=>{ AU.on=!AU.on; if(AU.master) AU.master.gain.setTargetAtTime(AU.on?0.85:0,AU.ctx.currentTime,0.05); $('#ic-snd').hidden=!AU.on; $('#ic-mute').hidden=AU.on; $('#btn-snd').setAttribute('aria-label',AU.on?'静音':'打开声音'); };
$('#btn-q').onclick=()=>{ Q.hi=!Q.hi; $('#btn-q').textContent=Q.hi?'高画质':'流畅'; Q.scale=Q.hi?1:0.7; D.refl.visible=Q.hi; resize(); };
$('#btn-fs').onclick=()=>{ const el=document.documentElement; try{ if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(e){} };
const scrub=$('#scrub'), tip=$('#tip');
const posToT=e=>{ const r=scrub.getBoundingClientRect(); return clamp((e.clientX-r.left)/r.width,0,1)*DUR; };
let dragging=false;
scrub.addEventListener('pointerdown',e=>{ dragging=true; scrub.setPointerCapture(e.pointerId); seek(posToT(e)); });
scrub.addEventListener('pointermove',e=>{ const t=posToT(e), r=scrub.getBoundingClientRect(); tip.style.left=((t/DUR)*r.width)+'px'; tip.textContent=`${CH[chapterAt(t)].zh} · ${fmt(t)}`; if(dragging) seek(t); });
scrub.addEventListener('pointerup',()=>{ dragging=false; });
scrub.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){ seek(tl-5); e.preventDefault(); e.stopPropagation(); } if(e.key==='ArrowRight'){ seek(tl+5); e.preventDefault(); e.stopPropagation(); } });
addEventListener('keydown',e=>{ if(!started) return; if(e.key===' '||e.code==='Space'){ e.preventDefault(); $('#btn-play').click(); } else if(e.key==='ArrowLeft'){ seek(tl-5); poke(); } else if(e.key==='ArrowRight'){ seek(tl+5); poke(); } else if(e.key==='m'||e.key==='M'){ $('#btn-snd').click(); } else if(e.key==='f'||e.key==='F'){ $('#btn-fs').click(); } });
function start(){ audioInit(); if(AU.ctx) AU.ctx.resume(); started=true; body.classList.add('started'); $('#intro').classList.add('gone'); setTimeout(()=>{ $('#intro').hidden=true; },1900); seek(0); setPlaying(true); letterbox(); }
goBtn.onclick=start;
$('#again').onclick=()=>{ $('#outro').classList.remove('on'); seek(0); setPlaying(true); };
function letterbox(){ const w=innerWidth, h=innerHeight; const lb=started?Math.min(h*0.11,Math.max(0,(h-w/2.2)/2)):0; document.documentElement.style.setProperty('--lb',lb+'px'); }

/* =====================================================================
   RENDER LOOP
   ===================================================================== */
function resize(){
  const w=innerWidth, h=innerHeight, pr=Q.dpr*Q.scale*(Q.hi?1:0.85);
  renderer.setPixelRatio(pr); renderer.setSize(w,h,false);
  composer.setPixelRatio(pr); composer.setSize(w,h);
  finalPass.uniforms.res.value.set(w*pr,h*pr);
  const rw=Math.max(256,Math.round(w*pr*0.5)), rh=Math.max(256,Math.round(h*pr*0.5));
  D.refl.getRenderTarget().setSize(rw,rh); D.refl.material.uniforms.texel.value.set(1/rw,1/rh);
  D.jets.uniforms.uScale.value=h*pr;
  letterbox();
}
addEventListener('resize',resize);
let perfAcc=0, perfN=0, perfCool=4;
function perf(dt){ perfAcc+=dt; perfN++; perfCool-=dt; if(perfN>=45 && perfCool<=0){ const avg=perfAcc/perfN; perfAcc=0; perfN=0;
    if(avg>0.034 && Q.scale>0.5){ Q.scale=Math.max(0.5,Q.scale-0.1); resize(); perfCool=3; }
    else if(avg<0.018 && Q.scale<1 && Q.hi){ Q.scale=Math.min(1,Q.scale+0.06); resize(); perfCool=6; } } }
resize();
setProgress(0.95); await nextFrame();
try { applyState(0,performance.now()/1000,true); renderer.compile(scene,camera); } catch(e){ console.error(e); }
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.1,(now-lastNow)/1000); lastNow=now; const rt=now/1000;
  if(playing && !dragging){ tl=Math.min(DUR,tl+dt); }
  const t=started?tl:0;
  if(started && playing){
    for(const [et,name] of EVENTS) if(prevT<et && t>=et) sfx(name);
    const i=chapterAt(t); if(i!==curCh){ curCh=i; showCaption(i); }
    if(t>=152.6) $('#outro').classList.add('on');
    if(tl>=DUR){ setPlaying(false); }
  }
  prevT=t;
  const walk=applyState(t,rt,!started);
  if(started && playing && walk>0.5){ const si=Math.floor(t/0.53); if(si!==lastStep){ if(lastStep>=0) step(t<26.8?'stone':(t<88||(t>111&&t<114))?'marble':'carpet'); lastStep=si; } }
  audioFrame(t, started&&playing, walk);
  if(capTimer>0){ capTimer-=dt; if(capTimer<=0) capEl.classList.remove('on'); }
  if(ctlTimer>0 && playing){ ctlTimer-=dt; if(ctlTimer<=0) body.classList.remove('show-ctl'); }
  if(started) updateUI();
  composer.render();
  perf(dt);
}
requestAnimationFrame(tick);
setProgress(1);
goBtn.disabled=false; goBtn.textContent='开始入住';
window.__hotel={ seek:(t)=>{ if(!started){ started=true; body.classList.add('started'); $('#intro').hidden=true; } seek(t); setPlaying(false); }, play:()=>setPlaying(true), get t(){ return tl; } };
})();
</script>
