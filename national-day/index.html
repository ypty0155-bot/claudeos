<meta name="description" content="一段用代码实时生成的国庆短片：从嘉兴南湖的红船出发，经过开国大典、改革开放、飞天揽月、锦绣山河，来到天安门前的漫天烟花，庆祝中华人民共和国成立 77 周年。">

<style>
  /* One festive look by design: a red-and-gold film, the same in every theme. */
  :root{
    color-scheme: dark;
    --ink:#0a0405;
    --cream:#fbefd9;
    --cream-dim:rgba(251,239,217,.66);
    --faint:rgba(251,239,217,.2);
    --gold:#e3b04f;
    --gold-hi:#ffe19a;
    --red:#c8161d;
    --line:rgba(251,239,217,.18);
    --cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --brush:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  }
  html,body{height:100%}
  [hidden]{display:none!important}
  body{margin:0;background:#000;color:var(--cream);font-family:var(--cn);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #film{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#000;outline:none}

  #ctl{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
    padding:22px max(16px,3vw) calc(env(safe-area-inset-bottom,0px) + 16px);
    background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));opacity:0;pointer-events:none;transition:opacity .5s}
  body.started.show-ctl #ctl, body.started.paused #ctl{opacity:1;pointer-events:auto}
  .btn{appearance:none;border:1px solid var(--line);background:rgba(20,8,8,.45);color:var(--cream);height:36px;min-width:36px;padding:0 12px;border-radius:18px;
    display:inline-grid;place-items:center;cursor:pointer;font:500 12px/1 var(--cn);letter-spacing:.18em;transition:border-color .2s,background .2s}
  .btn:hover{border-color:var(--gold);background:rgba(227,176,79,.14)}
  .btn:focus-visible,#scrub:focus-visible,#go:focus-visible,#again:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
  .btn svg{width:14px;height:14px;display:block}
  .btn.round{padding:0;width:36px}
  #time{font:500 12px/1 var(--cn);font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--cream-dim);white-space:nowrap}
  #scrub{position:relative;flex:1;min-width:80px;height:30px;cursor:pointer;touch-action:none;outline:none}
  #chap{position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);display:flex;gap:3px}
  #chap span{position:relative;height:100%;background:var(--faint);overflow:hidden}
  #chap span i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold)}
  #knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:var(--gold-hi);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(227,176,79,.22);pointer-events:none}
  #tip{position:absolute;bottom:30px;left:0;transform:translateX(-50%);font:500 12px/1 var(--cn);letter-spacing:.08em;white-space:nowrap;background:rgba(14,6,6,.9);border:1px solid var(--line);padding:7px 10px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none}
  #scrub:hover #tip{opacity:1}
  @media (max-width:560px){ #time{display:none} }

  .ov{position:fixed;inset:0;z-index:5;display:flex;overflow-y:auto;text-align:center;padding-inline:16px}
  .ov>div{margin:auto;padding-block:28px}
  #intro{background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(60,6,8,.55),rgba(10,3,4,.92) 72%,#070203);transition:opacity 1.6s ease}
  #intro.gone{opacity:0;pointer-events:none}
  .emblem{width:74px;height:74px;margin:0 auto 18px;display:block;color:var(--gold)}
  #intro h1{font:400 clamp(56px,11vw,120px)/1 var(--brush);letter-spacing:.12em;margin:0 0 0 .12em;color:var(--gold-hi);text-shadow:0 0 28px rgba(255,170,60,.35)}
  #intro .sub{font:500 clamp(15px,2vw,19px)/1.5 var(--cn);letter-spacing:.34em;margin:18px 0 0 .34em;color:var(--cream)}
  #intro .lede{font:500 14px/1.95 var(--cn);color:var(--cream-dim);max-width:32em;margin:22px auto 0;letter-spacing:.05em}
  #go,#again{appearance:none;margin-top:30px;height:48px;padding:0 32px;border-radius:24px;border:1px solid var(--gold);background:rgba(200,22,29,.35);color:var(--gold-hi);
    font:700 15px/1 var(--cn);letter-spacing:.3em;cursor:pointer;transition:background .25s,color .25s,opacity .3s}
  #go:hover:not(:disabled),#again:hover{background:var(--gold);color:#3a0507}
  #go:disabled{cursor:progress;opacity:.75;border-color:var(--line);color:var(--cream-dim);background:transparent}
  #intro .hint{margin-top:18px;font:500 12px/1.8 var(--cn);letter-spacing:.14em;color:rgba(251,239,217,.45)}
  @media (max-height:560px){ .emblem{width:48px;height:48px;margin-bottom:10px} #intro .lede{margin-top:12px;font-size:13px;line-height:1.7} #go,#again{margin-top:16px} }
  #outro{background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(40,4,6,.2),rgba(0,0,0,.72));opacity:0;pointer-events:none;transition:opacity 2s ease}
  #outro.on{opacity:1}
  #outro.on #again{pointer-events:auto}
  #outro .big{font:400 clamp(56px,11vw,112px)/1 var(--brush);letter-spacing:.12em;margin:0 0 0 .12em;color:var(--gold-hi);text-shadow:0 0 30px rgba(255,160,50,.4)}
  #outro .yrs{font:700 14px/1 var(--cn);letter-spacing:.5em;color:var(--cream-dim);margin-top:20px}
  body.render #ctl, body.render .ov{display:none!important}
  @media (prefers-reduced-motion: reduce){ #intro,#outro,#ctl{transition-duration:.01s} }
</style>

    </svg>
    <h1>盛世华诞</h1>
    <p class="sub">庆祝中华人民共和国成立 77 周年</p>
    <p class="lede">从 1921 年嘉兴南湖的一叶红船出发，经过开国大典、改革开放、飞天揽月、锦绣山河，来到今夜天安门前的漫天烟花。画面和音乐全部由代码实时生成，全长约一分半钟。</p>
    <button id="go" disabled>正在准备…</button>

<script>
'use strict';
(async function main(){
/* =====================================================================
   盛世华诞 — a procedural National Day film.
   Every frame is a pure function of the timeline t (so it can be paused,
   scrubbed, or rendered frame by frame to video), and the soundtrack is an
   original score synthesised with Web Audio from the same timeline.
   ===================================================================== */
const $ = s => document.querySelector(s);
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

const W = 1920, H = 1080, DUR = 88;
const BPM = 96, BEAT = 60/BPM, BAR = 4*BEAT;           // one bar = 2.5 s
const B = (bar, beat=0) => (bar-1)*BAR + beat*BEAT;
const TAU = Math.PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), ease=x=>x*x*(3-2*x);
const easeOut=x=>1-(1-x)*(1-x)*(1-x), easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{ const c=1.70158; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h1(i,s){ let n=Math.imul(i|0,374761393)+Math.imul(s|0,668265263)|0; n=Math.imul(n^(n>>>13),1274126177); n^=n>>>16; return (n>>>0)/4294967296; }
function noise1(x,s){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return lerp(h1(i,s),h1(i+1,s),u); }
function fbm(x,s,o=4){ let v=0,a=.5,f=1,n=0; for(let k=0;k<o;k++){ v+=a*noise1(x*f,s+k*31); n+=a; a*=.5; f*=2.03; } return v/n; }
function mk(w,h){ const c=document.createElement('canvas'); c.width=Math.ceil(w); c.height=Math.ceil(h); return [c,c.getContext('2d')]; }
function vg(c,y0,y1,stops){ const g=c.createLinearGradient(0,y0,0,y1); for(const [p,col] of stops) g.addColorStop(p,col); return g; }
function hg(c,x0,x1,stops){ const g=c.createLinearGradient(x0,0,x1,0); for(const [p,col] of stops) g.addColorStop(p,col); return g; }
const SERIF='"Noto Serif SC","Songti SC","STSong","SimSun",serif';
const BRUSH='"Ma Shan Zheng","STKaiti","KaiTi",serif';

const CH=[
  {n:'壹', zh:'红船启航', t:0},
  {n:'贰', zh:'开国大典', t:B(6)},
  {n:'叁', zh:'改革开放', t:B(12)},
  {n:'肆', zh:'逐梦星辰', t:B(17)},
  {n:'伍', zh:'锦绣山河', t:B(22)},
  {n:'陆', zh:'盛世华诞', t:B(27)},
];
const chapterAt=t=>{ let i=0; for(let k=0;k<CH.length;k++) if(t>=CH[k].t) i=k; return i; };

/* =====================================================================
   ON-SCREEN WORDS
   [text, x, y, options]; a = appear time, b = leave time (scene-local s)
   ===================================================================== */
const T_BOAT=[
  ['1921', W/2, 236, {a:1.0, size:150, weight:900, style:'gold', spacing:.12, stagger:.14, dur:1.1, shine:true}],
  ['嘉兴南湖 · 一叶红船', W/2, 322, {a:2.4, b:7.4, size:44, style:'cream', spacing:.3, rule:120}],
  ['宣告中国共产党正式成立', W/2, 390, {a:3.8, b:7.4, size:40, weight:500, style:'cream', spacing:.24}],
  ['星星之火 可以燎原', W/2, 392, {a:8.1, size:100, brush:true, style:'gold', spacing:.08, stagger:.16, dur:.9}],
];
const T_FOUND=[
  ['1949 · 10 · 1', 880, 160, {a:.8, size:70, weight:900, style:'gold', spacing:.1, stagger:.07, rule:150}],
  ['中华人民共和国成立', 880, 258, {a:2.4, size:80, weight:900, style:'gold', spacing:.14, stagger:.09, shine:true}],
  ['中国人民从此站起来了', 880, 352, {a:8.4, size:66, brush:true, style:'cream', spacing:.06, stagger:.13, dur:.8, glow:.3}],
];
const T_REFORM=[
  ['1978', 120, 246, {a:.6, size:140, weight:900, style:'goldDk', align:'left', spacing:.06, stagger:.1}],
  ['改革开放 · 春天的故事', 124, 324, {a:1.8, size:48, style:'white', align:'left', spacing:.16}],
];
const REFORM_LIST=[['1997','香港回归祖国'],['1999','澳门回归祖国'],['2001','加入世界贸易组织'],['2008','北京奥运会'],['2017','复兴号驰骋神州']];
const T_LAUNCH=[
  ['2003', 120, 250, {a:.5, size:130, weight:900, style:'gold', align:'left', spacing:.06, stagger:.1}],
  ['神舟五号 · 中国人首次飞向太空', 124, 330, {a:1.6, size:42, style:'cream', align:'left', spacing:.12}],
  ['千年飞天 梦想成真', 120, 432, {a:3.3, size:78, brush:true, style:'gold', align:'left', spacing:.06, stagger:.14}],
];
const T_ORBIT=[
  ['可上九天揽月', 116, 236, {a:.7, size:104, brush:true, style:'gold', align:'left', spacing:.06, stagger:.15}],
];
const ORBIT_LIST=[['2020','北斗卫星导航系统全球组网'],['2021','祝融号火星车登陆火星'],['2022','天宫空间站全面建成'],['2024','嫦娥六号月背采样返回']];
const T_LAND=[
  ['2021', W/2, 196, {a:.6, b:6.3, size:120, weight:900, style:'red', spacing:.08, stagger:.1}],
  ['脱贫攻坚战取得全面胜利', W/2, 276, {a:1.6, b:6.3, size:46, style:'dred', spacing:.2}],
  ['全面建成小康社会', W/2, 340, {a:2.5, b:6.3, size:46, style:'dred', spacing:.2}],
  ['中国共产党成立一百周年', W/2, 404, {a:3.5, b:6.3, size:36, weight:500, style:'dred', spacing:.3, rule:110}],
  ['不忘初心 牢记使命', W/2, 262, {a:6.9, size:118, brush:true, style:'red', spacing:.08, stagger:.14}],
  ['新时代 · 新征程', W/2, 360, {a:8.9, size:44, style:'dred', spacing:.42, rule:130}],
];
const T_FEST=[
  ['1949 — 2026', W/2, 118, {a:2.4, size:32, weight:700, style:'cream', spacing:.5, rule:140}],
  ['盛世华诞', W/2, 318, {a:1.4, size:196, brush:true, style:'gold', spacing:.1, stagger:.28, dur:1.1, shine:true, glow:.28}],
  ['热烈庆祝中华人民共和国成立77周年', W/2, 418, {a:3.6, b:8.3, size:48, style:'cream', spacing:.16, shadow:'rgba(20,0,0,.95)', glow:.35}],
  ['没有共产党 就没有新中国', W/2, 418, {a:9.0, b:12.9, size:54, weight:900, style:'gold', spacing:.16, shadow:'rgba(20,0,0,.95)', glow:.35}],
  ['感恩伟大的党 · 祝福伟大的祖国', W/2, 418, {a:13.6, b:17.1, size:50, style:'cream', spacing:.16, shadow:'rgba(20,0,0,.95)', glow:.35}],
  ['祝愿祖国繁荣昌盛 · 国庆快乐', W/2, 418, {a:17.2, size:52, weight:900, style:'gold', spacing:.16, shadow:'rgba(20,0,0,.95)', glow:.35}],
];
const SLOGAN_L='中华人民共和国万岁', SLOGAN_R='世界人民大团结万岁';
const ALL_TEXT=[T_BOAT,T_FOUND,T_REFORM,T_LAUNCH,T_ORBIT,T_LAND,T_FEST].flat().map(r=>r[0]).join('')
  + REFORM_LIST.flat().join('') + ORBIT_LIST.flat().join('') + CH.map(c=>c.n+c.zh).join('') + SLOGAN_L + SLOGAN_R + '中国航天0123456789·—';

async function loadFonts(ms){
  if(!document.fonts || !document.fonts.load) return;
  const specs=[`900 80px ${SERIF}`,`700 80px ${SERIF}`,`500 80px ${SERIF}`,`400 80px ${BRUSH}`];
  try{ await Promise.race([Promise.all(specs.map(s=>document.fonts.load(s,ALL_TEXT))), new Promise(r=>setTimeout(r,ms))]); }catch(e){}
}

/* =====================================================================
   CANVAS, TYPE, SPRITES
   ===================================================================== */
const cv=$('#film'), ctx=cv.getContext('2d',{alpha:false});
const buf=document.createElement('canvas'), bctx=buf.getContext('2d',{alpha:false});
let S=1, quality=1;
function fit(){
  if(RENDER){ S=1; }
  else{
    const vw=innerWidth, vh=innerHeight, cw=Math.min(vw,vh*16/9), ch=cw*9/16;
    cv.style.width=cw+'px'; cv.style.height=ch+'px';
    const dpr=Math.min(devicePixelRatio||1,2);
    S=Math.max(.3,Math.min(1,cw*dpr/W)*quality);
  }
  const pw=Math.round(W*S), ph=Math.round(H*S);
  if(cv.width!==pw||cv.height!==ph){ cv.width=pw; cv.height=ph; buf.width=pw; buf.height=ph; }
}

const wcache=new Map();
function charW(c,ch){ const k=c.font+'|'+ch; let w=wcache.get(k); if(w===undefined){ w=c.measureText(ch).width; wcache.set(k,w); } return w; }
const STY={
  gold:  {stops:[[0,'#fff6d2'],[.42,'#ffd872'],[.64,'#e9a534'],[1,'#a8661a']], glow:'rgba(255,150,40,.55)'},
  goldDk:{stops:[[0,'#fff6d2'],[.42,'#ffd872'],[.64,'#e9a534'],[1,'#a8661a']], glow:'rgba(10,30,80,.55)'},
  cream: {solid:'#fbefd9', glow:'rgba(0,0,0,.6)'},
  white: {solid:'#ffffff', glow:'rgba(10,35,85,.6)'},
  red:   {stops:[[0,'#f43b3f'],[.55,'#c8141b'],[1,'#8a0a10']], glow:'rgba(255,246,220,.9)', rule:'#b3141b'},
  dred:  {solid:'#8c0f14', glow:'rgba(255,246,220,.9)', rule:'#b3141b'},
};
function txt(c,lt,s,x,y,o){
  const a0=o.a??0, b0=o.b??1e9;
  if(lt<a0||lt>b0+.9) return;
  const size=o.size, st=o.stagger??.055, du=o.dur??.9;
  const fade=1-ease(seg(lt,b0,b0+.8));
  const chars=Array.from(s);
  c.save();
  c.font=`${o.brush?400:(o.weight??700)} ${size}px ${o.brush?BRUSH:SERIF}`;
  c.textAlign='left'; c.textBaseline='alphabetic';
  const sp=(o.spacing??.08)*size;
  const ws=chars.map(ch=>ch===' '?size*.45:charW(c,ch));
  const total=ws.reduce((p,q)=>p+q,0)+sp*(chars.length-1);
  const x0=o.align==='left'?x:x-total/2;
  const sty=STY[o.style??'cream'];
  const k=c.getTransform().a;
  let fillG=sty.solid, fillL=sty.solid;
  if(sty.stops){
    fillG=c.createLinearGradient(0,y-size*.82,0,y+size*.12); fillL=c.createLinearGradient(0,-size*.47,0,size*.47);
    for(const [p,col] of sty.stops){ fillG.addColorStop(p,col); fillL.addColorStop(p,col); }
  }
  if(o.rule){
    const p=easeOut(seg(lt,a0,a0+1.4)), len=o.rule*p, ry=y-size*.36;
    c.globalAlpha=.8*p*fade; c.fillStyle=sty.rule??'#e7b45a';
    c.fillRect(x0-28-len,ry,len,1.6); c.fillRect(x0+total+28,ry,len,1.6);
  }
  c.shadowColor=o.shadow??sty.glow; c.shadowBlur=size*(o.glow??.2)*k;
  let cx=x0; const done=[];
  for(let i=0;i<chars.length;i++){
    const w=ws[i], ch=chars[i];
    const p=seg(lt,a0+i*st,a0+i*st+du);
    if(p>0&&ch!==' '){
      const al=easeOut(p)*fade*(o.alpha??1);
      c.globalAlpha=al;
      if(o.brush){
        const sc=lerp(1.4,1,easeOutBack(Math.min(1,p*1.1)));
        c.save(); c.translate(cx+w/2,y-size*.35); c.scale(sc,sc); c.fillStyle=fillL; c.fillText(ch,-w/2,size*.35); c.restore();
      }else{ c.fillStyle=fillG; c.fillText(ch,cx,y+(1-easeOut(p))*size*.3); }
      if(p>=1) done.push([ch,cx,al]);
    }
    cx+=w+sp;
  }
  if(o.shine&&done.length){
    const ph=((lt-a0-chars.length*st-du+.3)%6.5)/1.6;
    if(ph>0&&ph<1){
      const bx=lerp(x0-240,x0+total+240,ph);
      const g=c.createLinearGradient(bx-170,y-size,bx+170,y);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,'rgba(255,250,228,.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
      c.shadowBlur=0; c.globalCompositeOperation='lighter'; c.fillStyle=g;
      for(const [ch,px,al] of done){ c.globalAlpha=al*.85; c.fillText(ch,px,y); }
    }
  }
  c.restore();
}

function glowSprite(r,g,b,core=.18){

function mkStars(n,seed,y0,y1){ const R=mulberry32(seed); return Array.from({length:n},()=>({x:R()*W, y:lerp(y0,y1,Math.pow(R(),1.3)), s:.5+Math.pow(R(),4)*2.4, ph:R()*TAU, f:.6+R()*2.4})); }
function drawStars(c,arr,t,a,dy=0){
  c.fillStyle='#fff';
  for(const s of arr){
    const al=a*(.55+.45*Math.sin(t*s.f+s.ph))*Math.min(1,s.s*.6);
    if(al<=.01) continue;
    c.globalAlpha=al; const y=s.y+dy;

function star5(x,cx,cy,R,rot){ x.beginPath(); for(let i=0;i<10;i++){ const r=i%2?R*.381966:R, a=rot-Math.PI/2+i*Math.PI/5; x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); } x.closePath(); x.fill(); }
function bird(c,x,y,s,flap){
  const wy=flap*s*.8;
  c.beginPath();
  c.moveTo(x-s*1.1,y-wy);
  c.quadraticCurveTo(x-s*.5,y-wy*.3-s*.25,x,y);
  c.quadraticCurveTo(x+s*.5,y-wy*.3-s*.25,x+s*1.1,y-wy);
  c.quadraticCurveTo(x+s*.45,y-wy*.1+s*.05,x,y+s*.22);
  c.quadraticCurveTo(x-s*.45,y-wy*.1+s*.05,x-s*1.1,y-wy);
  c.fill();
  c.beginPath(); c.ellipse(x+s*.12,y+s*.08,s*.42,s*.14,-.2,0,TAU); c.fill();
}
/* a Chinese hip roof: upturned eave tips, curved slopes */
function roofPath(x,cx,y,hw,h){
  x.beginPath();
  x.moveTo(cx-hw-10,y-h*.42);
  x.quadraticCurveTo(cx-hw*.86,y+2,cx-hw*.66,y+2);
  x.lineTo(cx+hw*.66,y+2);
  x.quadraticCurveTo(cx+hw*.86,y+2,cx+hw+10,y-h*.42);
  x.quadraticCurveTo(cx+hw*.72,y-h*.62,cx+hw*.6,y-h);
  x.lineTo(cx-hw*.6,y-h);
  x.quadraticCurveTo(cx-hw*.72,y-h*.62,cx-hw-10,y-h*.42);
  x.closePath();
}

    if(fw.type==='ring'){ const a=i/fw.n*TAU, x1=Math.cos(a), y1=Math.sin(a)*fw.tilt; vx=(x1*Math.cos(fw.rot)-y1*Math.sin(fw.rot))*fw.speed; vy=(x1*Math.sin(fw.rot)+y1*Math.cos(fw.rot))*fw.speed; }

    else{ const th=r1*TAU, cz=r2*2-1, sn=Math.sqrt(1-cz*cz), s=fw.speed*(.9+r3*.14); vx=Math.cos(th)*sn*s; vy=Math.sin(th)*sn*s; }

    }
  }
}

function drawScene(c,s,t){

function render(t){
  let base=0, over=-1, w=0;

  const nx=SCENES[base+1];

  else if(base>0&&t<SCENES[base].t0+SCENES[base].xf/2){ over=base; base--; w=ease(seg(t,SCENES[over].t0-SCENES[over].xf/2,SCENES[over].t0+SCENES[over].xf/2)); }

    gc(now){ for(const v of voices) if(v.end<now-.2){ try{ v.g.disconnect(); }catch(e){} voices.delete(v); } },
  };
}

/* ---------- offline render for video export ---------- */
let PCM=null;
async function renderAudio(opt={}){
  const sr=48000, dur=opt.dur??DUR, oc=new OfflineAudioContext(2,Math.ceil(sr*dur),sr);
  const eng=makeEngine(oc);
  for(const e of SCORE) if(e.t<dur&&(!opt.types||opt.types.includes(e.type))) eng.play(e,e.t);
  const ab=await oc.startRendering();
  const L=ab.getChannelData(0), Rr=ab.getChannelData(1);
  let peak=0, sum=0; for(let i=0;i<L.length;i++){ const a=Math.max(Math.abs(L[i]),Math.abs(Rr[i])); if(a>peak) peak=a; sum+=L[i]*L[i]; }
  const g=peak>.97?.97/peak:1;
  PCM=new Int16Array(L.length*2);
  for(let i=0;i<L.length;i++){ PCM[2*i]=Math.round(clamp(L[i]*g,-1,1)*32767); PCM[2*i+1]=Math.round(clamp(Rr[i]*g,-1,1)*32767); }
  return {sr, frames:L.length, peak, rms:Math.sqrt(sum/L.length), bytes:PCM.byteLength};
}
function pcmChunk(off,len){
  const u8=new Uint8Array(PCM.buffer,off,Math.min(len,PCM.byteLength-off));
  let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}

await loadFonts(RENDER?25000:6000);
buildArt();
fit();

if(RENDER){
  window.film={W,H,DUR,canvas:cv,frame:t=>render(t),audio:o=>renderAudio(o),pcmChunk,fonts:()=>[...document.fonts].filter(f=>f.status==='loaded').map(f=>f.family+' '+f.weight),ready:true};
  render(0);
  return;
}

const body=document.body, goBtn=$('#go');
let tl=0, playing=false, started=false, ended=false, dirty=true, lastNow=performance.now();
let ac=null, eng=null, anchor=0, idx=0, muted=false;
function initAudio(){ if(ac) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; try{ ac=new AC(); eng=makeEngine(ac); }catch(e){ ac=null; eng=null; } }
function audioStart(t){
  if(!eng) return;
  eng.stopAll(); const now=ac.currentTime; anchor=now+.06-t;
  idx=0; while(idx<SCORE.length&&SCORE[idx].t<t) idx++;
  for(const e of SCORE){ if(e.t>=t) break; if(SUSTAIN.has(e.type)&&e.t+e.d>t+.3) eng.play({...e,d:e.t+e.d-t,a:.3},now+.06); }
}
function audioUpdate(t){
  if(!eng) return; const now=ac.currentTime;
  while(idx<SCORE.length&&SCORE[idx].t<t+.35){ const e=SCORE[idx++], w=anchor+e.t; if(w>=now-.03) eng.play(e,Math.max(w,now)); }
  eng.gc(now);
}
const chapWrap=$('#chap');
CH.forEach((c,i)=>{ const s=document.createElement('span'); const end=i<CH.length-1?CH[i+1].t:DUR; s.style.flex=String(end-c.t); s.appendChild(document.createElement('i')); chapWrap.appendChild(s); });
function fmt(s){ s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
$('#t-dur').textContent=fmt(DUR);
function updateUI(){
  $('#t-cur').textContent=fmt(tl);
  const kids=chapWrap.children; CH.forEach((c,i)=>{ const end=i<CH.length-1?CH[i+1].t:DUR; kids[i].firstChild.style.width=(clamp((tl-c.t)/(end-c.t),0,1)*100)+'%'; });
  $('#knob').style.left=(tl/DUR*100)+'%'; $('#scrub').setAttribute('aria-valuenow',String(Math.round(tl)));
}
let ctlTimer=0; function poke(){ body.classList.add('show-ctl'); ctlTimer=2.8; }
function setPlaying(p){
  playing=p; body.classList.toggle('paused',!p);
  $('#ic-play').hidden=p; $('#ic-pause').hidden=!p; $('#btn-play').setAttribute('aria-label',p?'暂停':'播放');
  if(p){ if(ac&&ac.state==='suspended') ac.resume(); audioStart(tl); } else if(eng) eng.stopAll();
  lastNow=performance.now();
}
function seek(t){
  tl=clamp(t,0,DUR-.01); dirty=true;
  if(ended){ ended=false; $('#outro').classList.remove('on'); }
  if(playing) audioStart(tl);
  updateUI();
}
addEventListener('pointermove',poke,{passive:true}); addEventListener('pointerdown',poke,{passive:true});
goBtn.onclick=()=>{ initAudio(); if(ac) ac.resume(); started=true; body.classList.add('started'); $('#intro').classList.add('gone'); setTimeout(()=>{ $('#intro').hidden=true; },1700); seek(0); setPlaying(true); poke(); };
$('#again').onclick=()=>{ seek(0); setPlaying(true); };
$('#btn-play').onclick=()=>{ if(ended){ seek(0); setPlaying(true); return; } setPlaying(!playing); poke(); };
$('#btn-snd').onclick=()=>{ muted=!muted; if(eng) eng.master.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.03); $('#ic-snd').hidden=muted; $('#ic-mute').hidden=!muted; $('#btn-snd').setAttribute('aria-label',muted?'打开声音':'静音'); poke(); };
$('#btn-fs').onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){} };
const scrub=$('#scrub'), tip=$('#tip');
const posToT=e=>{ const r=scrub.getBoundingClientRect(); return clamp((e.clientX-r.left)/r.width,0,1)*DUR; };
let dragging=false;
scrub.addEventListener('pointerdown',e=>{ dragging=true; scrub.setPointerCapture(e.pointerId); seek(posToT(e)); });
scrub.addEventListener('pointermove',e=>{ const t=posToT(e), r=scrub.getBoundingClientRect(); tip.style.left=((t/DUR)*r.width)+'px'; tip.textContent=`${CH[chapterAt(t)].zh} · ${fmt(t)}`; if(dragging) seek(t); });
scrub.addEventListener('pointerup',()=>{ dragging=false; });
scrub.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){ seek(tl-5); e.preventDefault(); e.stopPropagation(); } if(e.key==='ArrowRight'){ seek(tl+5); e.preventDefault(); e.stopPropagation(); } });
addEventListener('keydown',e=>{ if(!started) return;
  if(e.key===' '||e.code==='Space'){ e.preventDefault(); $('#btn-play').click(); }
  else if(e.key==='ArrowLeft'){ seek(tl-5); poke(); } else if(e.key==='ArrowRight'){ seek(tl+5); poke(); }
  else if(e.key==='m'||e.key==='M'){ $('#btn-snd').click(); } else if(e.key==='f'||e.key==='F'){ $('#btn-fs').click(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&playing) setPlaying(false); });
addEventListener('resize',()=>{ fit(); dirty=true; });

let perfAcc=0, perfN=0;
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(.1,(now-lastNow)/1000); lastNow=now;
  if(playing&&!dragging){
    tl=(ac&&ac.state==='running')?ac.currentTime-anchor:tl+dt;
    audioUpdate(tl);
    if(tl>=DUR-.01){ tl=DUR-.01; setPlaying(false); ended=true; $('#outro').classList.add('on'); }
    dirty=true;
  }
  if(dirty){
    const t0=performance.now(); render(tl); dirty=false;
    if(playing){ perfAcc+=performance.now()-t0; if(++perfN>=40){ const avg=perfAcc/perfN; perfAcc=0; perfN=0; if(avg>26&&quality>.5){ quality=Math.max(.5,quality*.85); fit(); } } }
  }
  if(ctlTimer>0&&playing){ ctlTimer-=dt; if(ctlTimer<=0) body.classList.remove('show-ctl'); }
  if(started) updateUI();
}
render(0);
requestAnimationFrame(tick);
goBtn.disabled=false; goBtn.textContent='开始播放';
window.__film={ seek:t=>{ if(!started){ started=true; body.classList.add('started'); $('#intro').hidden=true; } seek(t); setPlaying(false); }, get t(){ return tl; } };
})();
</script>
